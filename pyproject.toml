[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-copilot-agent"
version = "0.1.0"
description = "A local research workspace with streaming agents and PDF knowledge retrieval."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0.0",
    "pypdf>=4.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "isort>=5.13.0",
]

[tool.setuptools]
py-modules = ["api_config", "config", "config_loader", "main", "web_app", "web_runtime", "model_settings"]

[tool.setuptools.packages.find]
include = ["agent*", "llm*", "tools*", "retrievers*", "routing*", "ingest*", "semantic_router*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
